<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconMaker - Apple App Icon Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="gradient-bg"></div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#logo-gradient)"/>
                        <path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-gradient" x1="3" y1="3" x2="21" y2="21">
                                <stop offset="0%" style="stop-color:#667eea"/>
                                <stop offset="100%" style="stop-color:#764ba2"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>IconMaker</h1>
            </div>
            <p class="subtitle">专业的 Apple 应用图标生成工具</p>
        </header>

        <main class="main-content">
            <!-- 上传区域 -->
            <section class="upload-section">
                <div class="upload-card glass-card">
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="fileInput" accept="image/png" hidden>
                        <div class="upload-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <polyline points="17,8 12,3 7,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="12" y1="3" x2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h3>拖拽图片到此处或点击上传</h3>
                        <p>支持 PNG 格式，建议尺寸 1024×1024 或更大</p>
                    </div>
                    
                    <!-- 预览区域 -->
                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <div class="preview-header">
                            <span class="preview-title">原图预览</span>
                            <button class="btn-remove" id="btnRemove">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                        <div class="preview-image-wrapper">
                            <img id="previewImage" class="preview-image" alt="预览">
                        </div>
                        <div class="image-info">
                            <span id="imageSize"></span>
                            <span id="imageFile"></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 平台选择 -->
            <section class="platform-section" id="platformSection" style="display: none;">
                <div class="platform-card glass-card">
                    <h2 class="section-title">选择目标平台</h2>
                    <div class="platform-grid">
                        <label class="platform-item">
                            <input type="checkbox" class="platform-checkbox" value="ios" checked>
                            <div class="platform-icon ios-icon">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="4" y="4" width="16" height="16" rx="3"/>
                                </svg>
                            </div>
                            <span class="platform-name">iOS</span>
                            <span class="platform-sizes">1024, 180, 120</span>
                        </label>
                        
                        <label class="platform-item">
                            <input type="checkbox" class="platform-checkbox" value="ipad" checked>
                            <div class="platform-icon ipad-icon">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                                </svg>
                            </div>
                            <span class="platform-name">iPad</span>
                            <span class="platform-sizes">167, 152, 76</span>
                        </label>
                        
                        <label class="platform-item">
                            <input type="checkbox" class="platform-checkbox" value="watch" checked>
                            <div class="platform-icon watch-icon">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <circle cx="12" cy="12" r="9"/>
                                </svg>
                            </div>
                            <span class="platform-name">watchOS</span>
                            <span class="platform-sizes">11 种尺寸</span>
                        </label>
                        
                        <label class="platform-item">
                            <input type="checkbox" class="platform-checkbox" value="macos" checked>
                            <div class="platform-icon macos-icon">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                                </svg>
                            </div>
                            <span class="platform-name">macOS</span>
                            <span class="platform-sizes">1024, 512, 256...</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 生成按钮 -->
            <section class="generate-section" id="generateSection" style="display: none;">
                <button class="btn-generate" id="btnGenerate">
                    <span class="btn-text">生成图标包</span>
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M13 10V3L4 14H11V21L20 10H13Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>
            </section>

            <!-- 进度和结果 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <div class="result-card glass-card">
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-header">
                            <span>生成进度</span>
                            <span class="progress-percent" id="progressPercent">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-status" id="progressStatus">准备生成...</div>
                    </div>
                    
                    <div class="result-content" id="resultContent" style="display: none;">
                        <div class="success-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h3>生成完成！</h3>
                        <p class="result-info" id="resultInfo">共生成 0 个图标文件</p>
                        <button class="btn-download" id="btnDownload">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <line x1="12" y1="15" x2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>下载 ZIP 包</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>纯前端实现 · 无需上传服务器 · 安全隐私</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/icon-generator.js"></script>
    <script src="js/zip-handler.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
